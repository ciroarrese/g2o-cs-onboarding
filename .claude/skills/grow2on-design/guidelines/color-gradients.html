<!-- @dsCard group="Colors" viewport="700x170" name="Gradients" subtitle="Brand gradient, thumbnail washes and the aurora glow" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-family-base);color:var(--color-text-primary)}.sw{display:flex;gap:10px;flex-wrap:wrap}.c{flex:1;min-width:96px}.c i{display:block;height:56px;border-radius:10px;border:1px solid rgba(0,0,0,.06)}.c b{display:block;font-size:12px;font-weight:600;color:var(--g2o-black);margin-top:7px}.c s{display:block;font-family:var(--font-family-mono);font-size:10.5px;color:var(--g2o-gray-300);text-decoration:none;margin-top:1px}</style></head><body><div class="sw">
<div class="c"><i style="background:var(--gradient-brand)"></i><b>Brand</b><s>--gradient-brand</s></div>
<div class="c"><i style="background:var(--gradient-thumb)"></i><b>Thumb</b><s>--gradient-thumb</s></div>
<div class="c"><i style="background:var(--gradient-thumb-3)"></i><b>Thumb 3</b><s>--gradient-thumb-3</s></div>
<div class="c"><i style="background:var(--gradient-panel)"></i><b>Panel</b><s>--gradient-panel</s></div>
<div class="c"><i style="background:var(--gradient-aurora);filter:blur(10px)"></i><b>Aurora</b><s>--gradient-aurora</s></div>
</div><div style="margin-top:16px;font-size:26px;font-weight:700" class="g2o-grad-text">Centralizá tu catálogo.</div></body></html>
