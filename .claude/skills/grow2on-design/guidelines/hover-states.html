<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-family-base);color:var(--color-text-primary)}.sw{display:flex;gap:10px;flex-wrap:wrap}.c{flex:1;min-width:96px}.c i{display:block;height:56px;border-radius:10px;border:1px solid rgba(0,0,0,.06)}.c b{display:block;font-size:12px;font-weight:600;color:var(--g2o-black);margin-top:7px}.c s{display:block;font-family:var(--font-family-mono);font-size:10.5px;color:var(--g2o-gray-300);text-decoration:none;margin-top:1px}</style></head><body><style>.d{background:#fff;border:1px solid var(--g2o-gray-200);border-radius:16px;padding:14px;text-align:center;font-size:12px;color:var(--color-text-secondary);transition:all .25s ease}.d:hover{transform:translateY(-3px);box-shadow:var(--shadow-card-hover)}
.p{display:inline-flex;height:44px;align-items:center;padding:0 18px;border-radius:20px;border:1px solid var(--g2o-gray-200);background:#fff;font-size:14px;color:var(--color-text-primary);transition:border-color .2s ease}.p:hover{border-color:var(--g2o-pink)}
.bt{display:inline-flex;height:44px;align-items:center;padding:0 22px;border-radius:999px;border:1.5px solid var(--g2o-pink);color:var(--g2o-pink);background:transparent;font-size:14px;font-weight:600;transition:all .15s ease}.bt:hover{background:var(--g2o-pink);color:#fff}
.lk{font-size:14px;color:var(--color-text-primary)}.lk:hover{color:var(--g2o-pink)}</style>
<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
<div class="d" style="width:150px">Card · lift 3px</div><span class="p">Pill · pink border</span><span class="bt">Outline · fills</span><span class="lk">Nav link · turns pink</span>
<span style="display:inline-flex;height:44px;align-items:center;padding:0 18px;border-radius:20px;border:1px solid var(--g2o-pink);background:var(--tint-pink-8);font-size:14px;font-weight:600;color:var(--g2o-pink)">Active · 8% tint</span></div>
<div style="font-size:12px;color:var(--color-text-secondary);margin-top:14px">There are no press/active states in the source CSS — hover carries all the feedback. Nothing shrinks or darkens on click.</div></body></html>
