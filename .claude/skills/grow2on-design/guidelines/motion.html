<!-- @dsCard group="Brand" viewport="700x200" name="Motion" subtitle="Slow, looping, ambient — never bouncy" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-family-base);color:var(--color-text-primary)}.sw{display:flex;gap:10px;flex-wrap:wrap}.c{flex:1;min-width:96px}.c i{display:block;height:56px;border-radius:10px;border:1px solid rgba(0,0,0,.06)}.c b{display:block;font-size:12px;font-weight:600;color:var(--g2o-black);margin-top:7px}.c s{display:block;font-family:var(--font-family-mono);font-size:10.5px;color:var(--g2o-gray-300);text-decoration:none;margin-top:1px}</style></head><body><style>.b{width:150px;height:66px;border:1px solid var(--g2o-gray-200);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}</style>
<div style="display:flex;gap:14px;flex-wrap:wrap">
<div><div class="b"><span class="g2o-grad-text" style="font-size:19px;font-weight:700">Grow2on</span></div><div style="font-family:var(--font-family-mono);font-size:10px;color:var(--g2o-gray-300);margin-top:6px">g2o-gradient-shift 3.5s</div></div>
<div><div class="b"><span style="width:16px;height:16px;border-radius:50%;background:var(--g2o-pink);animation:g2o-badge-pulse 1.4s ease-in-out infinite"></span></div><div style="font-family:var(--font-family-mono);font-size:10px;color:var(--g2o-gray-300);margin-top:6px">g2o-badge-pulse 1.4s</div></div>
<div><div class="b"><span style="width:16px;height:16px;border-radius:50%;background:var(--g2o-orange);animation:g2o-dot-pulse 1.6s ease-in-out infinite"></span></div><div style="font-family:var(--font-family-mono);font-size:10px;color:var(--g2o-gray-300);margin-top:6px">g2o-dot-pulse 1.6s</div></div>
<div><div class="b"><span style="width:28px;height:28px;border-radius:50%;border:2px solid var(--g2o-pink);border-top-color:transparent;animation:g2o-spin 1.2s linear infinite"></span></div><div style="font-family:var(--font-family-mono);font-size:10px;color:var(--g2o-gray-300);margin-top:6px">g2o-spin</div></div>
<div><div class="b" style="justify-content:flex-start;padding:0 10px"><span style="width:30px;height:30px;border-radius:8px;background:var(--g2o-pink-light);border:1px solid var(--g2o-pink);animation:g2o-hero-float 4s ease-in-out infinite"></span></div><div style="font-family:var(--font-family-mono);font-size:10px;color:var(--g2o-gray-300);margin-top:6px">g2o-hero-float 4s</div></div>
<div><div class="b"><span style="width:36px;height:36px;border-radius:50%;background:#fff;animation:orbit-center-glow 1.8s ease-in-out infinite"></span></div><div style="font-family:var(--font-family-mono);font-size:10px;color:var(--g2o-gray-300);margin-top:6px">orbit-center-glow 1.8s</div></div>
</div></body></html>
