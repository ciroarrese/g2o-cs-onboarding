<!-- @dsCard group="Brand" viewport="700x260" name="Motion · Extended" subtitle="Reveal, chart-in and glow loops sourced from the Soporte & Onboarding deck" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-family-base);color:var(--color-text-primary)}
.grid{display:flex;gap:14px;flex-wrap:wrap}.b{width:150px;height:66px;border:1px solid var(--g2o-gray-200);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;position:relative}
.lbl{font-family:var(--font-family-mono);font-size:10px;color:var(--g2o-gray-300);margin-top:6px}
</style></head><body>
<div class="grid">
<div><div class="b" style="align-items:flex-end;gap:6px;padding-bottom:10px"><span style="width:10px;height:36px;background:var(--g2o-pink);border-radius:3px;transform-origin:bottom;animation:g2o-bar-up .9s ease-out both"></span><span style="width:10px;height:50px;background:var(--g2o-orange);border-radius:3px;transform-origin:bottom;animation:g2o-bar-up .9s .1s ease-out both"></span><span style="width:10px;height:28px;background:var(--g2o-purple);border-radius:3px;transform-origin:bottom;animation:g2o-bar-up .9s .2s ease-out both"></span></div><div class="lbl">g2o-bar-up (chart entrance)</div></div>
<div><div class="b" style="justify-content:flex-start;padding:0 12px"><span style="width:100%;height:6px;background:var(--gradient-brand);border-radius:3px;transform-origin:left;animation:g2o-bar-in 1.1s ease-out both"></span></div><div class="lbl">g2o-bar-in (progress fill)</div></div>
<div><div class="b"><span style="width:40px;height:40px;border-radius:50%;border:5px solid var(--g2o-pink-light);border-top-color:var(--g2o-pink);animation:g2o-donut-in .9s ease-out both"></span></div><div class="lbl">g2o-donut-in (gauge entrance)</div></div>
<div><div class="b"><span style="font-weight:700;color:var(--g2o-black);animation:g2o-rise .7s ease-out both">Reporte</span></div><div class="lbl">g2o-rise (content reveal)</div></div>
<div><div class="b" style="background:var(--g2o-black);overflow:hidden"><span style="position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,#ffffff4d,transparent);animation:g2o-sweep 2.2s ease-in-out infinite"></span></div><div class="lbl">g2o-sweep (shine sweep)</div></div>
<div><div class="b"><span style="width:34px;height:34px;border-radius:10px;background:var(--g2o-pink);animation:g2o-glow-pink 2s ease-in-out infinite"></span></div><div class="lbl">g2o-glow-pink (attention glow)</div></div>
<div><div class="b"><span style="width:14px;height:14px;background:var(--g2o-orange);clip-path:polygon(50% 0,61% 39%,100% 39%,69% 61%,79% 100%,50% 76%,21% 100%,31% 61%,0 39%,39% 39%);animation:g2o-twinkle 1.6s ease-in-out infinite"></span></div><div class="lbl">g2o-twinkle (sparkle)</div></div>
<div><div class="b"><span style="width:100%;height:100%;opacity:.6"><span style="position:absolute;width:60%;height:60%;left:-6%;top:-6%;border-radius:50%;background:var(--g2o-pink);filter:var(--blur-cloud);animation:g2o-drift-a 8s ease-in-out infinite"></span><span style="position:absolute;width:50%;height:50%;right:-4%;bottom:-4%;border-radius:50%;background:var(--g2o-orange);filter:var(--blur-cloud);animation:g2o-drift-b 9s ease-in-out infinite"></span></span></div><div class="lbl">g2o-drift-a/b (cloud drift v2)</div></div>
<div><div class="b"><span style="width:34px;height:34px;border-radius:50%;background:var(--g2o-purple);animation:g2o-opacity-pulse 1.8s ease-in-out infinite"></span></div><div class="lbl">g2o-opacity-pulse</div></div>
</div>
</body></html>
