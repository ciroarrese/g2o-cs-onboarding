<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Grow2on — UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="Shared.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Pages.jsx"></script>
<script type="text/babel">
const {Header,Footer}=window.Grow2onDesignSystem_455be5;
function App(){
  const [page,setPage]=React.useState('home');
  const go=p=>{setPage(p);window.scrollTo(0,0)};
  const P={home:Home,integraciones:Integraciones,funcionalidades:Funcionalidades,blog:Blog,hablemos:Hablemos,erp:Erp}[page]||Home;
  const links=NAV.map(n=>({...n,href:'#',onClick:()=>go(n.page)}));
  return <>
    <div onClick={e=>{const a=e.target.closest('a');if(!a)return;const t=a.textContent.trim();const hit=NAV.find(n=>n.label===t);if(hit){e.preventDefault();go(hit.page)}}}>
      <Header logo={A+'brand/logo-grow2on.png'} links={links} ctaLabel="Hablemos" onCta={()=>go('hablemos')}/>
    </div>
    <P go={go}/>
    <Footer logo={A+'brand/logo-grow2on.png'}
      blurb="Grow2on centraliza tu catálogo y lo sincroniza con todos tus canales de venta."
      columns={FOOTER.columns} offices={FOOTER.offices}
      bottom={<span>© GROW2ON 2026. Todos los derechos reservados.</span>}/>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
